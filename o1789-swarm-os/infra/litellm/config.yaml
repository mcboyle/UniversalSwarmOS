  # O1592 proxy-routing r2: .125 joins ONLY after its env is MAX_LOADED_MODELS=3 CONTEXT_LENGTH=16384 NUM_PARALLEL=2
  # (hermes + qwen7b + nomic co-resident; with MAX_LOADED_MODELS=1 each swap costs 7.5-10.4 s, TEST.md). ctx 16384 there.
  - model_name: qwen2.5-coder-7b-16k
    litellm_params: {model: ollama/qwen2.5-coder:7b-16k, api_base: http://10.0.10.137:11434}
