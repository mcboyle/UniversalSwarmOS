router_settings:
  # O1588/O1592 proxy-routing (claude/proxy-routing): simple-shuffle picks by litellm_params.weight. In litellm 1.103.0 a
  # deployment WITHOUT weight scores 0.0 and is never picked if any peer in its group has one: weight all or none of a group.
  # Weighted: trivial, qwen2.5-coder-7b (.137 2080 Ti = 2, T4s = 1), ci-summary, nomic-embed-text (1 each). bge-m3/rag-embed = uniform.
  routing_strategy: simple-shuffle # was usage-based-routing-v2
  enable_pre_call_checks: true
  optional_pre_call_checks:
    - session_affinity
    - deployment_affinity
    - prompt_caching
  deployment_affinity_ttl_seconds: 86400
  # O1510 (RULING-O1510-137-AFFINITY amend): embeddings exempt from deployment_affinity so they balance onto
  # the 137 CPU variants; an explicit entry replaces the global flags for that group, so session_affinity is kept.
  model_group_affinity_config:
    bge-m3: [session_affinity]
    nomic-embed-text: [session_affinity]
    # O1578: deployment_affinity pins one API key to one backend for 24h; with the single master key the chat groups
    # never balanced (24/24 probes on one GPU). These three keep session_affinity only, so sessions stay put, keys spread.
    trivial: [session_affinity]
    ci-summary: [session_affinity]
    qwen2.5-coder-7b: [session_affinity]
    qwen2.5-coder: [session_affinity]
  redis_host: 10.0.70.164
  redis_port: 6379
  num_retries: 2
  retry_after: 0.5
  fallbacks:
    - rag-embed: ["bge-m3", "local-embed"]
    - bge-m3: ["rag-embed", "local-embed"]
    - qwen3.6-35b-claude-opus-abliterated: ["tier1-fast", "local-coder"]
    - qwen3.6-35b-a3b-heretic: ["tier1-fast", "local-coder"]
    - local-coder: ["qwen2.5-coder-7b", "trivial"]
    - qwythos-9b-83: ["tier1-fast", "local-coder"]
    - "qwen2.5-coder:32b": ["tier1-fast", "local-coder"]
    - "qwen2.5-coder:14b": ["qwen2.5-coder-7b", "local-coder"]
    - "qwen2.5-coder:7b": ["local-coder", "trivial"]
    - "deepseek-coder-v2:16b": ["tier1-fast", "local-coder"]
    - "gemma3:12b": ["tier1-fast", "local-coder"]
    - "mistral-nemo:12b": ["tier1-fast", "local-coder"]
    - claude-opus-5-5: ["qwen3.6-35b-claude-opus-abliterated", "tier1-fast", "local-coder"]
    - fable-5-1: ["qwen3.6-35b-claude-opus-abliterated", "tier1-fast", "local-coder"]
    - kimi-k2.8: ["qwen3.6-35b-claude-opus-abliterated", "tier1-fast", "local-coder"]
    - gpt-6.1-sol: ["qwen3.6-35b-claude-opus-abliterated", "tier1-fast", "local-coder"]
    - agent-council-relief-commander: ["qwen3.6-35b-claude-opus-abliterated", "tier1-fast", "local-coder"]
    - agent-master-coder: ["qwen3.6-35b-claude-opus-abliterated", "tier1-fast", "local-coder"]
    - tier1-fast: ["auto-local", "qwen2.5-coder-32b-distributed"]
    - tier1-qwen3-coder-30b-a3b: ["auto-local", "qwen2.5-coder-32b-distributed"]
    - qwen2.5-coder-32b-distributed: ["tier1-fast", "qwen2.5-coder-14b", "qwen2.5-coder-7b"]
    - qwen2.5-coder-14b: ["qwen2.5-coder-7b", "trivial", "local-coder"]
    - qwen2.5-coder-7b: ["local-coder", "trivial"]
    - trivial: ["local-coder", "qwen2.5-coder-7b"]
    - ci-summary: ["local-coder", "trivial", "qwen2.5-coder-7b"]
