# LiteLLM proxy config -- fleet-local models only (Ollama on 10.0.70.228, 10.0.70.125, 10.0.70.72).
# Container: see run.sh beside this file. Health: GET /health (per-model), /health/liveliness, /v1/models.
model_list:
  # O1503 P0 (findings/GPU-WORKLOAD-READINESS-bd-worker-B1-B.md): dedicated workload aliases, one deployment each, no
  # fallbacks. Clients send no num_ctx: a per-request num_ctx != the loaded ctx reloads the model and can evict (F3).
  - model_name: ci-summary
    litellm_params: {model: ollama/qwen2.5-coder:7b, api_base: http://10.0.70.228:11434, weight: 1}
  - model_name: ci-summary
    litellm_params: {model: ollama/qwen2.5-coder:7b-16k, api_base: http://10.0.10.137:11434, weight: 10}
  # O1578: aidev T4 (5th Turing GPU) joins this group
  - model_name: ci-summary
    litellm_params: {model: ollama/qwen2.5-coder:7b, api_base: http://10.0.70.83:11434, weight: 1}
  # O1592 proxy-routing r2: .72 on ollama 0.34.0 with .228's env (ctx 32768); a 19,360-token prompt kept its head (TEST.md).
  - model_name: ci-summary
    litellm_params: {model: ollama/qwen2.5-coder:7b, api_base: http://10.0.70.72:11434, weight: 1}
  # .125 NOT in ci-summary: 4 prompts > 16384 tokens per 12 h on .228/.83 (max 28,540); .125 runs ctx 16384.
  - model_name: rag-embed
    litellm_params: {model: ollama/bge-m3:latest, api_base: http://10.0.70.228:11434}
    model_info: {mode: embedding}
  # O1510b (operator ORDER-OPTIMIZE-2080TI-CDP rev, 21:52Z): embeddings balanced 72 + 137, 137 on CPU-only variants
  # (Modelfile num_gpu 0 by bd-worker-B8-B) -- the 2080 Ti is reserved for qwen2.5-coder. Supersedes P0's "72 only".
  - model_name: rag-embed
    litellm_params: {model: ollama/bge-m3-cpu:latest, api_base: http://10.0.10.137:11434}
    model_info: {mode: embedding}
  # O1503: 125 removed from qwen2.5-coder-14b and trivial (MAX_LOADED_MODELS=1 there; every switch reloads, F2).
  - model_name: qwen2.5-coder-14b
    # TURING T2: fixed num_ctx so 14b fits the T4 (measured 12.15 GB all-VRAM, 15.0 tok/s, load 9.1 s; at the host
    # default 32768x4 slots it is 23.64 GB, 14.14 on GPU, 8.4 tok/s, load 20.1 s). Always the same value -> no extra reload.
    # LIMIT: prompts over 8192 tokens are SILENTLY truncated (ollama keeps the tail, done_reason not an error); the
    # 14b->7b fallback does NOT fire for them. Prompts <= 16384 tokens: use qwen2.5-coder-7b (.137 there is 7b-16k,
    # ctx 16384; .228/.83 are 32768). Prompts > 16384 tokens have NO safe group today (any group with .137 truncates).
    litellm_params: {model: ollama/qwen2.5-coder:14b, api_base: http://10.0.70.228:11434, num_ctx: 8192}
  - model_name: qwen2.5-coder-7b
    litellm_params: {model: ollama/qwen2.5-coder:7b, api_base: http://10.0.70.228:11434, weight: 1}
