version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-ingress
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.45
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana-dashboards
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3001"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor-metrics
    restart: unless-stopped
    privileged: true
    devices:
      - "/dev/kmsg:/dev/kmsg"
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  devdocs:
    image: ghcr.io/freecodecamp/devdocs:latest
    container_name: devdocs-mirror
    restart: unless-stopped
    ports:
      - "8088:9292"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devdocs.rule=Host(`devdocs.localhost`) || Host(`devdocs.mesh.local`)"
      - "traefik.http.services.devdocs.loadbalancer.server.port=9292"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-search
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.localhost`) || Host(`search.mesh.local`)"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: tei-embeddings
    restart: unless-stopped
    command:
      - "--model-id"
      - "/model"
      - "--port"
      - "80"
    ports:
      - "8081:80"
    volumes:
      - ./model:/model:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.embeddings.rule=Host(`embeddings.localhost`)"
      - "traefik.http.services.embeddings.loadbalancer.server.port=80"

volumes:
  grafana-data:
