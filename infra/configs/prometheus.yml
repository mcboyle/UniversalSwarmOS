global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "forgejo"
    metrics_path: /metrics
    static_configs:
      - targets: ["forgejo:3000"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["test5:8085"]

  - job_name: "mesh-system"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "mesh-telemetry"
    static_configs:
      - targets: ["host.docker.internal:9105"]
