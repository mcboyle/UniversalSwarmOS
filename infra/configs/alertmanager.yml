global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'tier', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        tier: gpu-acceleration
      receiver: 'gpu-alerts'
    - match:
        tier: fabric-network
      receiver: 'fabric-alerts'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://test5:9095/alerts/default'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://test5:9095/alerts/critical'
        send_resolved: true

  - name: 'gpu-alerts'
    webhook_configs:
      - url: 'http://test5:9095/alerts/gpu'
        send_resolved: true

  - name: 'fabric-alerts'
    webhook_configs:
      - url: 'http://test5:9095/alerts/fabric'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
